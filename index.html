<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Viewport: mobile-first; user-scalable disabled to keep tap-zoom from triggering on number inputs -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#1f6feb" />

  <!-- PWA: manifest tells the browser this site is installable, and the icon shown on the home screen -->
  <link rel="manifest" href="manifest.webmanifest" />
  <!-- iOS-specific home-screen icon (iOS ignores manifest icons for "Add to Home Screen") -->
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Cash Register" />

  <title>Cash Register Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ================================================================== -->
  <!-- HEADER: app title + settings (gear) button                          -->
  <!-- ================================================================== -->
  <header class="app-header">
    <h1>Cash Register</h1>
    <button id="settings-btn" class="icon-btn" aria-label="Settings" title="Settings">
      <!-- Inline SVG gear icon — avoids needing a separate image file -->
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9.4 4l1.9-1.5-1.9-3.3-2.3.7a7.6 7.6 0 0 0-1.7-1l-.4-2.4h-3.8l-.4 2.4a7.6 7.6 0 0 0-1.7 1l-2.3-.7-1.9 3.3L8.8 12 6.9 13.5l1.9 3.3 2.3-.7c.5.4 1.1.7 1.7 1l.4 2.4h3.8l.4-2.4c.6-.3 1.2-.6 1.7-1l2.3.7 1.9-3.3L21.4 12z"/>
      </svg>
    </button>
  </header>

  <!-- ================================================================== -->
  <!-- MAIN: two scrollable lists                                          -->
  <!--   • Bills & Coins — loose denominations from DENOMINATIONS in JS    -->
  <!--   • Coin Rolls    — full rolls from COIN_ROLLS in JS                -->
  <!-- Both lists' rows are generated by app.js so adding/removing items   -->
  <!-- only requires editing the constants in app.js.                      -->
  <!-- ================================================================== -->
  <main>
    <h2 class="section-title">Bills &amp; Coins</h2>
    <div id="denomination-list" aria-label="Loose bills and coins"></div>

    <h2 class="section-title">Coin Rolls</h2>
    <div id="roll-list" aria-label="Coin rolls"></div>
  </main>

  <!-- ================================================================== -->
  <!-- FOOTER: sticky bar with the running total + the "Balance" action    -->
  <!-- ================================================================== -->
  <footer class="app-footer">
    <div class="total-row">
      <span class="total-label">Total</span>
      <span id="total-amount" class="total-amount">$0.00</span>
    </div>
    <button id="balance-btn" class="primary-btn">Balance to <span id="target-display">$200</span></button>
  </footer>

  <!-- ================================================================== -->
  <!-- BALANCE RESULT MODAL: shown after pressing the "Balance" button     -->
  <!-- Hidden by default via the `hidden` attribute — JS toggles it.       -->
  <!-- ================================================================== -->
  <div id="balance-modal" class="modal" hidden>
    <div class="modal-content">
      <header class="modal-header">
        <h2>Balance Result</h2>
        <button class="icon-btn close-btn" data-close="balance-modal" aria-label="Close">&times;</button>
      </header>
      <!-- Filled in by JS (renderBalanceResult). Three possible states:      -->
      <!--   1. ok          - shows list of items to remove                   -->
      <!--   2. shortfall   - till is under target, lists missing denoms      -->
      <!--   3. unreachable - exact target not possible with current coins    -->
      <div id="balance-result"></div>
    </div>
  </div>

  <!-- ================================================================== -->
  <!-- SETTINGS MODAL: edit target amount + ideal float composition        -->
  <!-- Hidden by default — opens when the gear icon is tapped.             -->
  <!-- ================================================================== -->
  <div id="settings-modal" class="modal" hidden>
    <div class="modal-content">
      <header class="modal-header">
        <h2>Settings</h2>
        <button class="icon-btn close-btn" data-close="settings-modal" aria-label="Close">&times;</button>
      </header>

      <div class="settings-body">
        <!-- Target total field -->
        <label class="field">
          <span>Target amount ($)</span>
          <input id="target-input" type="number" inputmode="decimal" step="0.01" min="0" />
        </label>

        <!-- Ideal composition: how many of each denomination should remain
             in the till after balancing. Sum must equal the target. -->
        <h3>Ideal float composition</h3>
        <p class="hint">How many of each should stay in the till after balancing. The sum must equal the target.</p>
        <div id="ideal-list"></div>

        <!-- Live sum vs target — turns red if mismatched -->
        <div class="ideal-sum-row">
          <span>Composition total:</span>
          <span id="ideal-sum">$0.00</span>
        </div>

        <!-- Validation message when sum doesn't equal target -->
        <p id="ideal-error" class="error-text" hidden></p>

        <div class="settings-actions">
          <button id="reset-defaults-btn" class="secondary-btn">Reset to defaults</button>
          <button id="save-settings-btn" class="primary-btn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- App logic. `defer` ensures DOM is parsed before script runs. -->
  <script src="app.js" defer></script>

  <!-- ================================================================== -->
  <!-- Service worker registration — caches files so the app works offline -->
  <!-- once the user has loaded it once. Required for proper PWA install.  -->
  <!-- ================================================================== -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => {
          // Non-fatal: the app still works online without the SW.
          console.warn('Service worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
